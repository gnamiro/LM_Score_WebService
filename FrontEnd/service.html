    <title>بررسی درستی جملات به کمک NLM فارسی</title>
</head>

<body>

    <div class="container">
        <form method="post">
            <div class="form-group textarea-form">
                <textarea class="form-control textarea" id="sentence" placeholder="من به [MASK] می‌روم." rows="3"></textarea>
                <label class="__label textarea-label" for="sentence">جمله مورد نظر با در نظر گرفتن توکن [MASK] بنویسید.</label>
            </div>
            <div class="words" id="words">
                <div class="form-group">
                    <input type="text" class="form-control" id="word1" name="word1" placeholder="کلمه اول">
                    <label class="__label" for="word1">کلمه اول</label>
                </div>
                <div class="form-group">
                    <input type="text" class="form-control" id="word2" name="word2" placeholder="کلمه دوم">
                    <label class="__label" for="word2">کلمه دوم</label>
                </div>
                <div class="form-group">
                    <input type="text" class="form-control" id="word3" name="word3" placeholder="کلمه سوم">
                    <label class="__label" for="word3">کلمه سوم</label>
                </div>
            </div>
            <div class="buttons">
                <button type="submit">تایید</button>
                <button id="wordAugment"><i class="fa-solid fa-circle-plus fa-beat"></i></button>
                <div id="error_messages"></div>
            </div>
        </form>    
        <div class="results" id="results">
        </div>
    </div>
